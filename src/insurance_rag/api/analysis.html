<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产品与分析</title><style>body{max-width:1000px;margin:32px auto;padding:20px;color:#18324a;background:#f2f5f8;font:16px/1.7 system-ui}section{background:white;padding:24px;margin:20px 0;border-radius:12px}a{color:#146b8d}button,input{font:inherit;padding:8px}li{margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><body data-local-session="false"><h1>产品与分析</h1><nav><a href="/agent">保险助手</a> · <a href="/product-upload">上传与查看资料</a></nav><p>个人利益表按资料中已核验的目标提供；未接通项目保留缺口，官方案例保留原条件。</p><div id="auth"><label>访问令牌 <input id="token" type="password"></label><button id="refresh">载入</button></div><p id="status" role="status"></p><section><h2>已发布产品</h2><ul id="products"></ul></section><section><h2>分析记录</h2><p>在保险助手中读取分析记录，可继续比较或变更条件重算。</p><ul id="history"></ul><pre id="detail"></pre></section><script>
const $=id=>document.getElementById(id);
async function api(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+$('token').value}});if(!r.ok)throw Error('请求未完成（'+r.status+'），请从保险助手页面重新进入。');return r.json()}
async function load(){try{const [library,history]=await Promise.all([api('/v1/product-library'),api('/v1/analyses')]);$('products').replaceChildren();for(const p of library.products||[]){const li=document.createElement('li'),a=document.createElement('a');a.textContent=p.product_name;a.href='/product-upload?bundle_id='+encodeURIComponent(p.bundle_id);li.append(a);$('products').append(li)}$('history').replaceChildren();for(const row of history.analyses||[]){const li=document.createElement('li'),b=document.createElement('button');b.textContent=new Date(row.created_at*1000).toLocaleString()+' '+(row.preview||'分析记录').slice(0,70);b.onclick=async()=>{try{const result=await api('/v1/analyses/'+encodeURIComponent(row.analysis_id));$('detail').textContent=JSON.stringify(result,null,2)}catch(e){$('status').textContent=e.message}};li.append(b);$('history').append(li)}$('status').textContent='已载入当前产品库与可读取的分析记录。'}catch(e){$('status').textContent=e.message}}
$('refresh').onclick=load;if(document.body.dataset.localSession==='true')$('auth').hidden=true;load();
</script></body></html>
