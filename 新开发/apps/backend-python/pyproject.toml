[project]
name = "baoxian-api-python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.163.0",
  "uvicorn==0.54.0",
  "PyMySQL[rsa]==1.1.2",
  "bullmq==3.6.1",
  "httpx==0.28.1",
  "minio==7.2.20",
  "beautifulsoup4==4.14.3",
  "pdfplumber==0.11.9",
  "pypdf==6.10.0",
  "pypdfium2==5.13.0",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
ocr = [
  "rapidocr-onnxruntime==1.4.4",
  "onnxruntime==1.23.2",
  "opencv-python==4.11.0.86",
  "Shapely==2.1.2",
  "pyclipper==1.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["baoxian_api", "baoxian_api.*"]
